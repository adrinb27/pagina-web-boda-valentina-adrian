services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pagina-boda-valadri
    container_name: pagina-boda-valadri
    # HOST_PORT = port on your machine, PORT = port inside the container.
    # Both default to 8080 and can be overridden via the environment or a .env file.
    ports:
      - "8087"
    environment:
      - PORT=8087
    restart: always
