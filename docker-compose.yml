services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pagina-boda-valadri
    container_name: pagina-boda-valadri
    # HOST_PORT = port on your machine, PORT = port inside the container.
    # Host port 8026 is mapped to container port 8026 (nginx listens on PORT).
    # Pinning the host side keeps the address stable across restarts/redeploys.
    ports:
      - "8026:8026"
    environment:
      - PORT=8026
    restart: always
